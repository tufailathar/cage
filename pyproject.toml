[project]
name = "cage"
version = "1.0.0"
description = "Autonomous Pentesting Agent powered by Meta Muse Spark"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.14.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "websockets>=12.0",
]

[project.scripts]
cage = "cage.cli.main:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
